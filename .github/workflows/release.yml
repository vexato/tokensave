name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./cmd/tokensave

  build:
    needs: verify
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -eu
          name="tokensave_${GOOS}_${GOARCH}"
          binary="tokensave"
          if [ "$GOOS" = windows ]; then binary="tokensave.exe"; fi
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -buildvcs=false -o "$binary" ./cmd/tokensave
          mkdir package
          mv "$binary" package/
          mkdir -p package/skills
          cp -R skills/tokensave package/skills/tokensave
          cp LICENSE README.md package/
          test -f package/"$binary"
          test -f package/LICENSE
          test -f package/README.md
          test -f package/skills/tokensave/SKILL.md
          if [ "$ARCHIVE" = zip ]; then
            (cd package && zip -r "../$name.zip" tokensave.exe LICENSE README.md skills)
          else
            tar -czf "$name.tar.gz" -C package tokensave LICENSE README.md skills
          fi
          test -s "$name.$ARCHIVE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: tokensave_*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -eu
          cd dist
          test "$(find . -maxdepth 1 -type f -name 'tokensave_*' | wc -l)" -eq 5
          sha256sum tokensave_* > checksums.txt
          test -s checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/tokensave_*
            dist/checksums.txt
