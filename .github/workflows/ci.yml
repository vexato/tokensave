name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./cmd/tokensave
      - name: Check patch whitespace
        shell: bash
        run: git diff --check
      - name: Check Unix scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f scripts/install.sh
          test -f scripts/benchmark.sh
          bash -n scripts/install.sh
          bash -n scripts/benchmark.sh
          sh scripts/test-installers.sh
      - name: Check PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object ToString; exit 1 }
          & .\scripts\test-installers.ps1
      - name: Run benchmark smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: sh scripts/benchmark.sh

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
