name: Feature request
description: Propose a compatible improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem being solved}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: textarea
    id: usage
    attributes: {label: Example usage}
  - type: textarea
    id: alternatives
    attributes: {label: Alternatives considered}
  - type: textarea
    id: compatibility
    attributes: {label: Compatibility concerns}
